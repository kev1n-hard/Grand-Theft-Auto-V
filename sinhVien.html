<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Theft Auto V - Thông tin sinh viên</title>
    <link rel="stylesheet" href="styleSinhVien.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="rockstar-logo">R★</span>
                <span class="game-title">GRAND THEFT AUTO V</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">Tổng quan</a>
                <a href="story.html">Câu chuyện</a>
                <a href="https://www.rockstargames.com/gta-online" target="_blank">GTA Online</a>
                <a href="register.html" class="buy-btn-nav">Mua ngay</a>
            </nav>
        </div>
    </header>

    <!-- Student Info Section -->
    <section class="student-section">
        <div class="student-container">
            <div class="form-header">
                <h2>THÔNG TIN SINH VIÊN</h2>
            </div>
            
            <div class="student-profile">
                <!-- Ảnh được bo góc -->
                <div class="image-wrapper">
                    <img src="Index Images/student-avatar.jpg" alt="Bùi Quang Nghĩa" class="student-img">
                </div>
                
                <!-- THAY ĐỔI: Chuyển từ input form sang text report -->
                <!-- Họ tên -->
                <div class="info-group">
                    <label>Họ tên:</label>
                    <div class="info-text">Bùi Quang Nghĩa</div>
                </div>

                <!-- Mã sinh viên -->
                <div class="info-group">
                    <label>Mã sinh viên:</label>
                    <div class="info-text">25004005</div>
                </div>

                <!-- Sở thích Unordered List -->
                <div class="info-group">
                    <label>Sở thích:</label>
                    <ul class="hobby-list">
                        <li>Đọc sách</li>
                        <li>Nghe nhạc</li>
                        <li>Chơi game</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <div class="footer-logo">R★ ROCKSTAR GAMES</div>
            <div class="footer-links">
                <a href="#">Liên hệ</a>
                <a href="#">Bảo mật</a>
                <a href="#">Điều khoản</a>
                <a href="sinhVien.html" class="active">Trang sinh viên</a>
            </div>
        </div>
    </footer>

</body>
</html>
